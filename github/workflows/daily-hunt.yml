name: Kavian Prime Daily Hunt

on:
  schedule:
    - cron: '30 4 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Run bot
        run: python bot.py

      - name: Save memory
        run: |
          git config --global user.name "KavianBot"
          git config --global user.email "bot@kavian.com"
          git add kavian_memory.json
          git commit -m "Save memory" || echo "No changes"
          git push
